syntax = "proto3";

package rpc;

option go_package = "github.com/jsndz/bottle/rpc/proto";

enum FrameType {
  UNARY = 0;
  STREAM_DATA=  1;
  STREAM_END= 2;
  HEARTBEAT = 3;
}

message Message {
  uint32 id = 1;
  FrameType type = 2;
  map<string,string> headers =3;
  string method = 4;
  bytes payload = 5;
  string error = 6;
}